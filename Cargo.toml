[package]
name = "litecast"
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
description = "LiteCast Studio — lightweight OBS-style recorder / streamer (Rust + FLTK + ffmpeg)"

[dependencies]
fltk = { version = "1.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
